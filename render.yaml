services:
  - type: web
    name: inboxguardian
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard/app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --server.enableStaticServing=true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    autoDeploy: true

  - type: static
    name: inboxguardian-static
    buildCommand: echo "no build needed"
    staticPublishPath: static
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /static/*
        destination: /$1
